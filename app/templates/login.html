<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
      body {background-color: #004d39;}
    </style>
  </head>
  <body>
    <div class="main_label">
      <h1>RouteSIM</h1>
    </div>
    <div class="login">
      <h1>Авторизация</h1>
      <form action="" method="post">
      {{ form.hidden_tag() }}
      {{ form.username.label }}<br>
      {{ form.username }}<br>
      {{ form.password.label }}<br>
      {{ form.password }}<br>
      {{ form.submit() }}
      </form>
      {% for msg in get_flashed_messages() %}
      <div align="middle">
         <span style="color: red;">{{ msg }}</span>
      </div>
      {% endfor %}
    </div>
    <!-- <div class="footer_l">Используя сайт routesim.ru, Вы даете согласие на обработку файлов cookie - <a href="{{ url_for('cook_info') }}" style="color: white; text-decoration: underline;">Подробнее</a> -->
    </div>
  </body>
</html>
